<script>
    document.getElementById('current-year').textContent = new Date().getFullYear();

    const prefersDarkQuery = window.matchMedia('(prefers-color-scheme: dark)');
    const modes = ['auto', 'light', 'dark'];

    function applyTheme(theme) {
        let actualTheme = theme;
        let iconName = '';

        if (theme === 'auto') {
            actualTheme = prefersDarkQuery.matches ? 'dark' : 'light';
            iconName = 'ph:desktop-bold';
        } else if (theme === 'light') {
            iconName = 'ph:sun-bold';
        } else if (theme === 'dark') {
            iconName = 'ph:moon-stars-bold';
        }

        document.documentElement.setAttribute('data-bs-theme', actualTheme);

        const themeIcon = document.getElementById('themeIcon');
        if (themeIcon) {
            themeIcon.setAttribute('data-icon', iconName);
        }

        // 更新按鈕的 aria-label 提示目前模式
        const btnSwitch = document.getElementById('btnSwitch');
        if (btnSwitch) {
            let labelText = '切換主題（目前：跟隨系統）';
            if (theme === 'light') labelText = '切換主題（目前：淺色模式）';
            if (theme === 'dark') labelText = '切換主題（目前：深色模式）';
            btnSwitch.setAttribute('aria-label', labelText);
        }
        localStorage.setItem('blog-theme', theme);
    }

    let currentTheme = localStorage.getItem('blog-theme') || 'auto';
    applyTheme(currentTheme);

    document.getElementById('btnSwitch').addEventListener('click', () => {
        let currentIndex = modes.indexOf(currentTheme);
        let nextIndex = (currentIndex + 1) % modes.length;
        currentTheme = modes[nextIndex];
        applyTheme(currentTheme);
    });


    prefersDarkQuery.addEventListener('change', () => {
        if (currentTheme === 'auto') {
            applyTheme('auto');
        }
    });


    document.addEventListener('DOMContentLoaded', function () {
        appendSkill()
        appendProjects()
        appendSideProjects()

        mediumZoom('.card-img-top');

        let mybutton = document.getElementById("btn-back-to-top");

        window.onscroll = function () {
            if (
                document.body.scrollTop > 200 ||
                document.documentElement.scrollTop > 200
            ) {
                mybutton.style.display = "block";
            } else {
                mybutton.style.display = "none";
            }
        };

        mybutton.addEventListener("click", function () {
            document.body.scrollTop = 0;
            document.documentElement.scrollTop = 0;
        });


    });
</script>
